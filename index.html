<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Quest: To Be & Adjectives</title>
  <style>
    :root {
      --bg: #F5EFE3;
      --primary: #657562;
      --secondary: #1B3B4A;
      --accent: #E07A5F;
      --white: #FFFFFF;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    
    body {
      background-color: var(--bg);
      color: var(--secondary);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: var(--white);
      border-radius: 20px;
      padding: 30px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      text-align: center;
    }

    .badge {
      background-color: var(--primary);
      color: var(--white);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      text-transform: uppercase;
      display: inline-block;
      margin-bottom: 15px;
    }

    .context-box {
      background-color: #EFE8DA;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
      font-size: 1.05rem;
    }

    .pt-hint {
      color: #666;
      font-size: 0.9rem;
      font-style: italic;
      margin-top: 5px;
    }

    .sentence {
      font-size: 1.4rem;
      font-weight: bold;
      margin: 20px 0;
      color: var(--secondary);
    }

    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    button.btn-option {
      background-color: var(--bg);
      border: 2px solid var(--primary);
      color: var(--secondary);
      padding: 12px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button.btn-option:hover {
      background-color: var(--primary);
      color: var(--white);
    }

    .feedback {
      min-height: 50px;
      font-size: 1.1rem;
      font-weight: bold;
      margin-top: 10px;
    }

    .feedback.correct { color: #2E7D32; }
    .feedback.wrong { color: #C62828; }

    .score-board {
      margin-top: 15px;
      font-size: 0.9rem;
      color: var(--secondary);
      opacity: 0.8;
    }

    .next-btn {
      background-color: var(--secondary);
      color: var(--white);
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      display: none;
      margin: 10px auto 0;
    }
  </style>
</head>
<body>

<div class="card">
  <span class="badge" id="level-tag">Desafio To Be</span>
  
  <div class="context-box">
    <div id="scenario">Cenário...</div>
    <div class="pt-hint" id="pt-translation">Tradução...</div>
  </div>

  <div class="sentence" id="english-sentence">...</div>

  <div class="options" id="options-container"></div>

  <div class="feedback" id="feedback"></div>
  <button class="next-btn" id="next-btn" onclick="nextQuestion()">Bora pra próxima! 🚀</button>

  <div class="score-board">
    Pontuação: <span id="score">0</span> | Rodada: <span id="current">1</span>/<span id="total">5</span>
  </div>
</div>

<script>
  const challengeData = [
    {
      scenario: "Você está na praia do Rio e o sol está muito forte.",
      translation: "O dia está ensolarado e nós estamos felizes.",
      sentence: "The day _____ sunny and we _____ happy!",
      options: ["is / are", "are / is", "is / am", "am / are"],
      correct: 0,
      praise: "Mandou bem demais! 🏖️",
      explanation: "Lembre-se: 'The day' = it (is), 'we' = (are)."
    },
    {
      scenario: "Descrevendo seu melhor amigo de infância.",
      translation: "O Lucas é muito alto e engraçado.",
      sentence: "Lucas _____ very tall and funny.",
      options: ["are", "am", "is", "be"],
      correct: 2,
      praise: "Show de bola! ⚽",
      explanation: "Lucas é 'ele' (he), então usamos 'is'."
    },
    {
      scenario: "Chegando atrasado no treino de futebol.",
      translation: "Eles estão atrasados para o jogo.",
      sentence: "They _____ late for the game!",
      options: ["is", "are", "am", "be"],
      correct: 1,
      praise: "Caraca, você tá afiado! 🔥",
      explanation: "Para 'They' (eles/elas), a forma correta é 'are'."
    },
    {
      scenario: "Falando sobre sua nova rotina de estudos.",
      translation: "Eu estou cansado, mas o livro é interessante.",
      sentence: "I _____ tired, but the book _____ interesting.",
      options: ["is / am", "am / is", "are / is", "am / are"],
      correct: 1,
      praise: "Massa demais! 🧠",
      explanation: "'I' combina com 'am' e 'the book' (it) combina com 'is'."
    },
    {
      scenario: "Apresentando sua família em uma foto.",
      translation: "Minha mãe e meu pai são médicos incríveis.",
      sentence: "My parents _____ amazing doctors.",
      options: ["is", "am", "are", "be"],
      correct: 2,
      praise: "Perfeito! Mandou muito! 🎉",
      explanation: "'My parents' equivale a 'they' (plural), por isso usamos 'are'."
    }
  ];

  let currentIndex = 0;
  let score = 0;

  function loadQuestion() {
    const q = challengeData[currentIndex];
    document.getElementById("scenario").innerText = q.scenario;
    document.getElementById("pt-translation").innerText = `"${q.translation}"`;
    document.getElementById("english-sentence").innerText = q.sentence;
    document.getElementById("feedback").innerText = "";
    document.getElementById("feedback").className = "feedback";
    document.getElementById("next-btn").style.display = "none";
    document.getElementById("current").innerText = currentIndex + 1;
    document.getElementById("total").innerText = challengeData.length;

    const optionsContainer = document.getElementById("options-container");
    optionsContainer.innerHTML = "";

    q.options.forEach((opt, index) => {
      const btn = document.createElement("button");
      btn.className = "btn-option";
      btn.innerText = opt;
      btn.onclick = () => checkAnswer(index);
      optionsContainer.appendChild(btn);
    });
  }

  function checkAnswer(selectedIndex) {
    const q = challengeData[currentIndex];
    const feedback = document.getElementById("feedback");
    const buttons = document.querySelectorAll(".btn-option");

    buttons.forEach(btn => btn.disabled = true);

    if (selectedIndex === q.correct) {
      score += 10;
      document.getElementById("score").innerText = score;
      feedback.innerText = `${q.praise} ${q.explanation}`;
      feedback.classList.add("correct");
    } else {
      feedback.innerText = `Ops! Quase lá... 😅 A resposta certa era "${q.options[q.correct]}". ${q.explanation}`;
      feedback.classList.add("wrong");
    }

    document.getElementById("next-btn").style.display = "inline-block";
  }

  function nextQuestion() {
    currentIndex++;
    if (currentIndex < challengeData.length) {
      loadQuestion();
    } else {
      showFinalScreen();
    }
  }

  function showFinalScreen() {
    const card = document.querySelector(".card");
    card.innerHTML = `
      <h2>Mandou Demais! 🏆</h2>
      <p style="margin: 20px 0; font-size: 1.2rem;">Você fez <strong>${score}</strong> pontos de ${challengeData.length * 10} possíveis.</p>
      <button class="next-btn" style="display:inline-block;" onclick="location.reload()">Jogar de novo 🔄</button>
    `;
  }

  loadQuestion();
</script>
</body>
</html>
