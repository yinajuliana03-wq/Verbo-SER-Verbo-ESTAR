<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workplace English: To Be & Adjectives</title>
  <style>
    :root {
      --bg: #F5EFE3;
      --primary: #657562;
      --secondary: #1B3B4A;
      --white: #FFFFFF;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: var(--bg); color: var(--secondary); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: var(--white); border-radius: 20px; padding: 30px; max-width: 550px; width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.08); text-align: center; }
    .badge { background-color: var(--primary); color: var(--white); padding: 6px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; text-transform: uppercase; margin-bottom: 15px; display: inline-block; }
    .context-box { background-color: #EFE8DA; padding: 15px; border-radius: 12px; margin-bottom: 20px; text-align: left; }
    .pt-hint { color: #555; font-size: 0.95rem; font-style: italic; margin-top: 5px; }
    .sentence { font-size: 1.3rem; font-weight: bold; margin: 20px 0; color: var(--secondary); }
    .options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    button.btn-option { background-color: var(--bg); border: 2px solid var(--primary); color: var(--secondary); padding: 12px; border-radius: 10px; font-size: 0.95rem; font-weight: 600; cursor: pointer; }
    button.btn-option:hover { background-color: var(--primary); color: var(--white); }
    .feedback { min-height: 50px; font-size: 0.95rem; font-weight: bold; margin-top: 10px; padding: 10px; border-radius: 8px; text-align: left; }
    .feedback.correct { color: #2E7D32; background-color: #E8F5E9; }
    .feedback.wrong { color: #C62828; background-color: #FFEBEE; }
    .next-btn { background-color: var(--secondary); color: var(--white); border: none; padding: 12px 24px; border-radius: 10px; font-size: 1rem; cursor: pointer; display: none; margin: 15px auto 0; }
  </style>
</head>
<body>

<div class="card">
  <span class="badge">Prática Divertida: To Be + Adjetivos</span>
  
  <div class="context-box">
    <div id="scenario"><strong>Cenário:</strong> Loading...</div>
    <div class="pt-hint" id="pt-translation">"..."</div>
  </div>

  <div class="sentence" id="english-sentence">...</div>
  <div class="options" id="options-container"></div>
  <div class="feedback" id="feedback"></div>
  <button class="next-btn" id="next-btn" onclick="nextQuestion()">Próximo Desafio! 🚀</button>
</div>

<script>
  // Banco de dados enfocado en contraste Portugués-Inglés
  const challengeData = [
    {
      scenario: "Dizendo que a apresentação está pronta e o cliente está online.",
      translation: "A apresentação está pronta e o cliente está online.",
      sentence: "The presentation [substantivo] _____ ready [adjetivo] and the client _____ online.",
      options: ["is / is", "are / is", "is / are", "am / is"],
      correct: 0,
      praise: "Mandou bem! 👏",
      explanation: "Em inglês, 'presentation' e 'client' são 3ª pessoa do singular (It / He/She), por isso usam 'IS'."
    },
    {
      scenario: "Elogiando a equipe de analistas no final do projeto.",
      translation: "Os analistas são muito dedicados.",
      sentence: "The analysts [substantivo] _____ very dedicated [adjetivo].",
      options: ["is", "are", "am", "be"],
      correct: 1,
      praise: "Show de bola! ⚽",
      explanation: "'Analysts' está no plural (They). Diferente do português, o adjetivo 'dedicated' não recebe 'S' no plural!"
    },
    {
      scenario: "Atualizando seu chefe sobre seu status atual.",
      translation: "Eu estou muito ocupado hoje.",
      sentence: "I _____ very busy [adjetivo] today.",
      options: ["is", "are", "am", "be"],
      correct: 2,
      praise: "Massa demais! 🎯",
      explanation: "Para 'I' (Eu), a única forma correta do verbo To Be no presente é 'AM'."
    }
  ];

  let currentIndex = 0;

  function loadQuestion() {
    const q = challengeData[currentIndex];
    document.getElementById("scenario").innerHTML = `<strong>Cenário:</strong> ${q.scenario}`;
    document.getElementById("pt-translation").innerText = `"${q.translation}"`;
    document.getElementById("english-sentence").innerText = q.sentence;
    document.getElementById("feedback").innerText = "";
    document.getElementById("feedback").className = "feedback";
    document.getElementById("next-btn").style.display = "none";

    const optionsContainer = document.getElementById("options-container");
    optionsContainer.innerHTML = "";

    q.options.forEach((opt, index) => {
      const btn = document.createElement("button");
      btn.className = "btn-option";
      btn.innerText = opt;
      btn.onclick = () => checkAnswer(index);
      optionsContainer.appendChild(btn);
    });
  }

  function checkAnswer(selectedIndex) {
    const q = challengeData[currentIndex];
    const feedback = document.getElementById("feedback");
    document.querySelectorAll(".btn-option").forEach(btn => btn.disabled = true);

    if (selectedIndex === q.correct) {
      feedback.innerText = `${q.praise} ${q.explanation}`;
      feedback.classList.add("correct");
    } else {
      feedback.innerText = `Quase lá! 😅 A resposta certa é "${q.options[q.correct]}". ${q.explanation}`;
      feedback.classList.add("wrong");
    }
    document.getElementById("next-btn").style.display = "block";
  }

  function nextQuestion() {
    currentIndex = (currentIndex + 1) % challengeData.length;
    loadQuestion();
  }

  loadQuestion();
</script>
</body>
</html>
